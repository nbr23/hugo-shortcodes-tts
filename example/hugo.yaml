baseURL: 'https://example.org/'
languageCode: 'en-us'
title: 'My New Hugo Site'

theme: ['ananke', 'hugo-shortcodes-tts']

params:
  tts:
    apiUrl: "http://tts-api:8080/api/tts"

security:
  http:
    contentTypes:
      - "audio/wav"
      - "audio/mpeg"
    mediaTypes:
      - "audio/wav"
      - "audio/mpeg"
    methods:
    - (?i)GET|POST
    urls:
    - .*

mediaTypes:
  "audio/wav":
    suffixes: 
      - wav

outputFormats:
  WAV:
    mediaType: "audio/wav"
    isPlainText: false
    isHTML: false
